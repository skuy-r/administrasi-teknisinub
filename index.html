<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrasi Teknisi</title><link rel="stylesheet" href="styles.css"></head>
<body><header><strong>⚙ Administrasi Teknisi</strong><nav id="nav" hidden><button data-page="dashboard">Dashboard</button><button data-page="repairs">Perbaikan</button><button data-page="stock">Kartu Stok</button><button data-page="users" id="usersBtn">Pengguna</button><span id="who"></span><button id="logout" class="secondary">Keluar</button></nav></header>

<footer>Administrasi Teknisi · Vercel + Supabase</footer>
